<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AdmitPath</title>
  <meta name="description" content="Sign in to your AdmitPath account to track applications, essays, checklists and counselor meetings.">
  <link rel="canonical" href="https://www.admitpath.example/login.html">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Login - AdmitPath">
  <meta property="og:description" content="Sign in to your AdmitPath account.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.13"></script>
  <script>tailwind.config={corePlugins:{preflight:false},theme:{extend:{colors:{jade:{DEFAULT:'#0E7C6B',600:'#12907C'},coral:'#E4572E',mist:'#E7F3F0',gold:'#E1A93E'}}}}</script>
  <link href="assets/css/variables.css" rel="stylesheet">
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/tailwind.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/responsive.css" rel="stylesheet">
  <link href="assets/css/dashboard.css" rel="stylesheet">
  <link href="assets/css/rtl.css" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
</head>
<body data-page="login" data-page-title="Login">
  <div class="ap-auth">
    <aside class="ap-auth__aside">
      <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80" alt="Students planning college applications">
      <a href="index.html" class="ap-auth__brand">
        <img class="ap-brand__mark ap-brand__img" src="assets/images/AdmitPath%20Admissions%20Counseling%20Badge.png" alt="AdmitPath Admissions Counseling">
        <span></span>
      </a>
      <div>
        <h2 style="color:#fff">Welcome back to your admissions journey.</h2>
        <p style="color:rgba(255,255,255,.85)">Track applications, manage deadlines, and get feedback all in one dashboard.</p>
      </div>
    </aside>

    <div class="ap-auth__form">
      <div class="ap-auth__card">
        <a href="index.html" class="ap-brand mb-4 d-inline-flex">
          <img class="ap-brand__mark ap-brand__img" src="assets/images/AdmitPath%20Admissions%20Counseling%20Badge.png" alt="AdmitPath Admissions Counseling">
          <span></span>
        </a>
        <h1 class="h3 mb-1">Sign in</h1>
        <p class="ap-text-muted mb-4">Enter your details to sign in.</p>

        <form data-login-form novalidate>
          <div class="ap-field">
            <label class="ap-label" for="loginEmail">Email address <span class="req">*</span></label>
            <input class="ap-input" type="email" id="loginEmail" name="email" data-validate="email" required placeholder="you@example.com" autocomplete="email">
            <div class="ap-error-msg" id="loginEmailError"></div>
          </div>
          <div class="ap-field">
            <label class="ap-label" for="loginPassword">Password <span class="req">*</span></label>
            <div class="ap-input-group">
              <input class="ap-input" type="password" id="loginPassword" name="password" required placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="ap-toggle-pass" data-pass-toggle="#loginPassword" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <div class="ap-error-msg" id="loginPasswordError"></div>
          </div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <label class="ap-check mb-0"><input type="checkbox" name="remember"> <span class="small">Remember me</span></label>
            <a href="forgot-password.html" class="small ap-link-inline">Forgot password?</a>
          </div>
          <button type="submit" class="btn-ap btn-ap--primary btn-ap--block btn-ap--lg">Sign in</button>
        </form>

        <div class="d-grid gap-2 mt-3">
          <button type="button" class="btn-ap btn-ap--outline btn-ap--block"><i class="bi bi-google"></i> Continue with Google</button>
          <button type="button" class="btn-ap btn-ap--outline btn-ap--block"><i class="bi bi-apple"></i> Continue with Apple</button>
        </div>

        <p class="text-center mt-3 mb-0 small">New to AdmitPath? <a href="register.html" class="ap-link-inline">Create a free account</a></p>
      </div>
    </div>
  </div>

  <div data-include="components/toast.html"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="pages/partials-loader.js"></script>
</body>
</html>
